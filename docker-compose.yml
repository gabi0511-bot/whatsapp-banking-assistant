services:
  postgres:
    image: postgres:16-alpine
    container_name: invoice-xray-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invoice_xray}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invoice_xray_secret}
      POSTGRES_DB: ${POSTGRES_DB:-invoice_xray}
      TZ: Europe/Bucharest
    ports:
      - "5432:5432"
    volumes:
      - invoice_xray_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invoice_xray} -d ${POSTGRES_DB:-invoice_xray}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  invoice_xray_pgdata:
